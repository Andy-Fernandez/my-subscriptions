    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"/>
    <title>Suscripciones</title>
    <style>
      html { background: #e5eef7; }
      body { margin: 0; }
      .app-launch {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        color: #19283e;
        text-align: center;
        font: 16px/1.4 system-ui, sans-serif;
      }
      .app-launch img {
        width: 104px;
        height: 104px;
        margin-bottom: 8px;
        border-radius: 26px;
        box-shadow: 0 14px 32px rgb(58 80 119 / 18%);
      }
      .app-launch strong { font-size: 24px; letter-spacing: -.04em; }
      .app-launch p { margin: 0; color: #4f5e76; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-launch">
        <img src="/icon-512.png" width="104" height="104" alt="" fetchpriority="high"/>
        <strong>Suscripciones</strong>
        <p class="app-launch-status" role="status">Cargando…</p>
        <noscript>
          <style>.app-launch-status { display: none; }</style>
          <p>Activa JavaScript para usar Suscripciones.</p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
